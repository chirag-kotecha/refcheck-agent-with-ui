# Usage:
#   cp .env.example .env   # fill in your API key(s) first
#   docker compose up api streamlit          # run the full API + UI stack
#   docker compose run --rm demo              # one-off CLI demos
#   docker compose run --rm demo-multi
#   docker compose run --rm batch             # Anthropic batch
#   docker compose run --rm batch-bedrock     # Bedrock batch
#   docker compose run --rm test              # pytest

services:
  api:
    build: .
    env_file: .env
    entrypoint: []
    command: ["uvicorn", "refcheck.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  streamlit:
    build: .
    env_file: .env
    entrypoint: []
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

  demo:
    build: .
    env_file: .env
    command: ["run_demo.py"]

  demo-multi:
    build: .
    env_file: .env
    command: ["run_demo_multi.py"]

  batch:
    build: .
    env_file: .env
    command: ["run_batch_demo.py"]

  batch-bedrock:
    build: .
    env_file: .env
    command: ["run_batch_demo.py", "--provider", "bedrock"]

  test:
    build: .
    env_file: .env
    command: ["-m", "pytest", "tests/", "-v"]
